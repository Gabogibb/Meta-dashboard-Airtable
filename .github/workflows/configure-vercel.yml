name: Configure Vercel Environment Variables

on:
  workflow_dispatch:
  push:
    branches:
      - claude/airtable-dashboard-vercel-nna37
    paths:
      - '.github/workflows/configure-vercel.yml'

jobs:
  configure-env:
    runs-on: ubuntu-latest
    steps:
      - name: Set Vercel Environment Variables
        run: |
          set -e
          PROJECT_ID="prj_HkxWtDSJsCHgcwirIhe3mozKHJpW"

          echo "Setting AIRTABLE_API_KEY..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "AIRTABLE_API_KEY",
              "value": "${{ secrets.AIRTABLE_API_KEY }}",
              "target": ["production", "preview", "development"],
              "type": "encrypted"
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [[ $HTTP_CODE -ge 400 ]]; then
            echo "Error setting AIRTABLE_API_KEY!"
            exit 1
          fi

          echo "Setting AIRTABLE_BASE_ID..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "AIRTABLE_BASE_ID",
              "value": "appQHdlwIGlr1Asye",
              "target": ["production", "preview", "development"],
              "type": "plain"
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [[ $HTTP_CODE -ge 400 ]]; then
            echo "Error setting AIRTABLE_BASE_ID!"
            exit 1
          fi

          echo "Setting GOOGLE_SHEETS_ID..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "GOOGLE_SHEETS_ID",
              "value": "17S5kCMPvlHr9ZJoh0G5pvyYqrdXZSH5X8yvbqkQKPG0",
              "target": ["production", "preview", "development"],
              "type": "plain"
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [[ $HTTP_CODE -ge 400 ]]; then
            echo "Error setting GOOGLE_SHEETS_ID!"
            exit 1
          fi

          echo "✓ All environment variables set successfully!"

      - name: Trigger Vercel Deployment
        run: |
          set -e
          PROJECT_ID="prj_HkxWtDSJsCHgcwirIhe3mozKHJpW"

          echo "Waiting for environment variables to propagate..."
          sleep 3

          echo "Triggering redeploy..."
          curl -s -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"gitMetadata":{"ref":"claude/airtable-dashboard-vercel-nna37"}}' | jq '.'
