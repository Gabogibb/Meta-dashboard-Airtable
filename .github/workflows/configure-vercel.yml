name: Configure Vercel Environment Variables

on:
  workflow_dispatch:
  push:
    branches:
      - claude/airtable-dashboard-vercel-nna37
    paths:
      - '.github/workflows/configure-vercel.yml'

jobs:
  configure-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Configure Vercel Environment Variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_9lfhdNbGLg4Q3U3Kx1rVWnJU
          VERCEL_PROJECT_ID: prj_HkxWtDSJsCHgcwirIhe3mozKHJpW
        run: |
          set -e

          echo "Setting environment variables using Vercel CLI..."

          # Set AIRTABLE_API_KEY
          echo "  - AIRTABLE_API_KEY"
          vercel env add AIRTABLE_API_KEY production preview development <<< "${{ secrets.AIRTABLE_API_KEY }}" || \
          vercel env pull

          # Set AIRTABLE_BASE_ID
          echo "  - AIRTABLE_BASE_ID"
          vercel env add AIRTABLE_BASE_ID production preview development <<< "appQHdlwIGlr1Asye" || \
          vercel env pull

          # Set GOOGLE_SHEETS_ID
          echo "  - GOOGLE_SHEETS_ID"
          vercel env add GOOGLE_SHEETS_ID production preview development <<< "17S5kCMPvlHr9ZJoh0G5pvyYqrdXZSH5X8yvbqkQKPG0" || \
          vercel env pull

          echo "✓ Environment variables configured!"

      - name: Trigger Production Deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_9lfhdNbGLg4Q3U3Kx1rVWnJU
          VERCEL_PROJECT_ID: prj_HkxWtDSJsCHgcwirIhe3mozKHJpW
        run: |
          echo "Triggering production deployment..."
          vercel deploy --prod
